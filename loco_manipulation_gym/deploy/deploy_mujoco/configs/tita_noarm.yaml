# 
policy_path: "{LOCO_MANI_GYM_ROOT_DIR}/logs/tita_noarm/exported/policies/policy_1.pt"
xml_path: "{LOCO_MANI_GYM_ROOT_DIR}/resources/robots/tita_noarm/scene.xml"

# Total simulation time
simulation_duration: 60.0
# Simulation time step
simulation_dt: 0.001
# Controller update frequency (meets the requirement of simulation_dt * controll_decimation=0.02; 50Hz)
control_decimation: 2

# Joint order: right_hip, right_knee, right_ankle, left_hip, left_knee, left_ankle

kps: [60, 60, 60, 60, 60, 60]
kds: [1, 1, 1, 1, 1, 1]

default_angles: [0.8,  -1.5,  0.0, 
                 0.8,  -1.5,  0.0]

lin_vel_scale: 2.0
ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_scale: 0.5
cmd_scale: [2.0, 2.0, 0.25]
num_actions: 6
num_obs: 30

cmd_init: [0.5, 0, 0.5]